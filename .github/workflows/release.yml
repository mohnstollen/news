name: Release

# A tag "podfang-v1.1" or "news-v1.9" builds that app's signed release APK and publishes it as a
# GitHub release, which the apps' update check finds. The version in the tag must be the
# appVersion in the app's build.gradle.kts.
#
# Secrets (Settings → Secrets and variables → Actions):
#   RELEASE_KEYSTORE_BASE64  the signing keystore, base64-encoded (required)
#   RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
#                            optional; without them the values of an Android debug keystore apply

on:
  push:
    tags:
      - "news-v*"
      - "podfang-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: App und Version aus dem Tag
        id: tag
        run: |
          tag="$GITHUB_REF_NAME"
          app="${tag%%-v*}"
          version="${tag#*-v}"
          case "$app" in
            news) module=app; title=News ;;
            podfang) module=podfang; title=Podfang ;;
            *) echo "::error::Unbekannte App im Tag $tag"; exit 1 ;;
          esac
          if ! grep -q "^val appVersion = \"$version\"$" "$module/build.gradle.kts"; then
            echo "::error::$module/build.gradle.kts hat nicht appVersion = \"$version\""
            exit 1
          fi
          {
            echo "app=$app"
            echo "module=$module"
            echo "title=$title"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Signierschlüssel
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::Das Secret RELEASE_KEYSTORE_BASE64 fehlt (siehe README, Abschnitt Releases)"
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Tests
        run: ./gradlew :core:testDebugUnitTest

      - name: Release-APK bauen
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew ":${{ steps.tag.outputs.module }}:assembleRelease"

      - name: Signatur prüfen
        id: apk
        run: |
          module="${{ steps.tag.outputs.module }}"
          apk="$RUNNER_TEMP/${{ steps.tag.outputs.app }}-${{ steps.tag.outputs.version }}.apk"
          cp "$module/build/outputs/apk/release/$module-release.apk" "$apk"
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$apksigner" verify --print-certs "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "${{ steps.tag.outputs.title }} ${{ steps.tag.outputs.version }}" \
            --generate-notes
