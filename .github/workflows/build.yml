name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :core:testDebugUnitTest
      - name: Debug-APKs bauen
        run: ./gradlew :app:assembleDebug :podfang:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: news-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: podfang-debug-apk
          path: podfang/build/outputs/apk/debug/podfang-debug.apk
