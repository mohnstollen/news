name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Debug-APK bauen
        run: ./gradlew :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: news-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Werkzeuge für das Debian-Paket
        run: sudo apt-get install -y fakeroot
      - name: Tests
        run: ./gradlew :desktop:test
      - name: Linux-Pakete bauen
        run: ./gradlew :desktop:packageDeb :desktop:packageRpm
      - uses: actions/upload-artifact@v4
        with:
          name: news-linux
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
